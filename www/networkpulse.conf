<VirtualHost *:8001>
        ServerName networkpulse
        ErrorLog /var/log/httpd/networkpulse.error.log
        CustomLog /var/log/httpd/networkpulse.access.log combined
        TimeOut 600
        LimitRequestLine 16380

        DocumentRoot /var/www/networkpulse
        ScriptAlias /cgi-bin/ "/var/www/networkpulse/"

        <Directory /var/www/networkpulse>
                Options +ExecCGI -Indexes +MultiViews
                AddHandler cgi-script .py
                Require all granted
                Order allow,deny
                Allow from all
        </Directory>

</VirtualHost>